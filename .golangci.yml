# Lint config — applied per Go module (backbone + cli) via the
# golangci-lint job in .github/workflows/ci.yml. Patterned after the
# tighter config from the OSS korva repo so contributors used to that
# style see the same gates here.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # suspicious constructs (shadow, unreachable, …)
    - ineffassign    # unused assignments
    - staticcheck    # SA/ST/QF rules
    - unused         # exported + unexported dead code
    - misspell       # spelling in comments / strings
    - unconvert      # unnecessary type conversions
    - bodyclose      # http.Response body never closed
    - nilerr         # returns nil instead of err
  settings:
    errcheck:
      # Idiomatic Go that doesn't warrant a wrap.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - os.Remove
        - os.RemoveAll
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - testdata
      - vendor
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      - path: \.pb\.go$
        linters:
          - errcheck
          - govet
          - staticcheck
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AlcanDev/korva-platform

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
