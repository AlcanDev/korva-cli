name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 5m ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: golangci-lint run --timeout=5m

  govuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  cross-compile:
    name: Cross-compile (smoke)
    # Runs on macOS so we exercise the lipo + pkgbuild path that produces
    # the universal binary and .pkg. Linux + Windows binaries are
    # cross-compiled from this same job (CGO_ENABLED=0).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Build every target
        env:
          KORVA_VERSION: ci-smoke
        run: ./installer/build.sh
      - name: Smoke-test the universal binary
        run: |
          chmod +x installer/dist/korva-darwin-universal
          ./installer/dist/korva-darwin-universal version
          ./installer/dist/korva-darwin-universal help
